[env:esp32-p4-rev300]
platform = symlink://local_envs/platforms/platform-espressif32-55.03.311
board = esp32-p4-evboard
framework = espidf

; সিরিয়াল মনিটরের স্পিড (আপনার দেওয়া ছবিতে 115,200 bps উল্লেখ ছিল)
monitor_speed = 115200

; macOS-এর জন্য পোর্ট কনফিগারেশন (আপনার CH34x সিরিজের USB চিপের জন্য)
; সঠিক পোর্টটি নিশ্চিত হওয়ার পর নিচের লাইনগুলোর সামনের সেমিকোলন (;) সরিয়ে আনকমেন্ট করতে পারেন
; upload_port = /dev/cu.wchusbserial*ra 
; monitor_port = /dev/cu.wchusbserial*

; ফার্মওয়্যার ডেভেলপমেন্টের জন্য বেসিক বিল্ড ফ্ল্যাগ
build_flags =
    -D CORE_DEBUG_LEVEL=3         ; ডিবাগিং মেসেজ (Info level) দেখার জন্য
    -D ARDUINO_USB_MODE=1         ; হার্ডওয়্যার USB সিরিয়াল মোড এনাবল করার জন্য
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; বুট হওয়ার সাথে সাথে USB-এর মাধ্যমে সিরিয়াল আউটপুট পেতে
